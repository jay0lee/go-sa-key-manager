name: Release

on:
  schedule:
    # Run once a week during the slowest hours in the USA:
    # Sunday at 08:00 UTC (1:00 AM PDT / 4:00 AM EDT / 12:00 AM HST)
    - cron: '0 8 * * 0'
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v2026.09.17.1200). Defaults to UTC date/time tag.'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write

env:
  GCP_WIF_PROVIDER: 'projects/47347081886/locations/global/workloadIdentityPools/gh-actions-pool/providers/gh-oidc-provider'
  GCP_PROJECT_STANDARD: 'sakm-ci-std-8560'
  GCP_PROJECT_NO_CREATE: 'sakm-ci-noc-8560'
  GCP_PROJECT_NO_UPLOAD: 'sakm-ci-nou-8560'
  GCP_PROJECT_EXPIRY_24H: 'sakm-ci-exp-8560'

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Compute release version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${{ github.ref_name }}"
          else
            VER="v$(date -u +'%Y.%m.%d.%H%M')"
          fi
          # Strip any accidental .testNN suffix if present
          VER=$(echo "$VER" | sed -E 's/\.test[0-9]+//g')
          echo "Release version: $VER"
          echo "version=$VER" >> $GITHUB_OUTPUT

  build:
    name: Build & Test (${{ matrix.name }})
    needs: [version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native Linux x86_64
          - runner: ubuntu-latest
            name: Linux x86_64
            binary: gcp-sa-key-manager-linux-amd64
            archive: gcp-sa-key-manager-linux-amd64.tar.bz2
            pkg_type: tar.bz2
            runner_id: linux-amd64
            service_account: sa-ci-linux-amd64@sakm-ci-std-8560.iam.gserviceaccount.com
            darwin_flags: ""
            race: true
            check_coverage: true
          # Native Linux ARM64
          - runner: ubuntu-24.04-arm
            name: Linux ARM64
            binary: gcp-sa-key-manager-linux-arm64
            archive: gcp-sa-key-manager-linux-arm64.tar.bz2
            pkg_type: tar.bz2
            runner_id: linux-arm64
            service_account: sa-ci-linux-arm64@sakm-ci-std-8560.iam.gserviceaccount.com
            darwin_flags: ""
            race: true
            check_coverage: false
          # Native macOS Apple Silicon ARM64 (Intel x86_64 Mac explicitly excluded)
          - runner: macos-latest
            name: macOS Apple Silicon (ARM64)
            binary: gcp-sa-key-manager-darwin-arm64
            archive: gcp-sa-key-manager-darwin-arm64.tar.bz2
            pkg_type: tar.bz2
            runner_id: macos-arm64
            service_account: sa-ci-macos-arm64@sakm-ci-std-8560.iam.gserviceaccount.com
            darwin_flags: "-macos 11.0"
            race: true
            check_coverage: false
          # Native Windows x86_64
          - runner: windows-latest
            name: Windows x86_64
            binary: gcp-sa-key-manager-windows-amd64.exe
            archive: gcp-sa-key-manager-windows-amd64.zip
            pkg_type: zip
            runner_id: windows-amd64
            service_account: sa-ci-windows-amd64@sakm-ci-std-8560.iam.gserviceaccount.com
            darwin_flags: ""
            race: true
            check_coverage: false
          # Native Windows ARM64 (Note: Go race detector / TSAN is unsupported on windows/arm64)
          - runner: windows-11-arm
            name: Windows ARM64
            binary: gcp-sa-key-manager-windows-arm64.exe
            archive: gcp-sa-key-manager-windows-arm64.zip
            pkg_type: zip
            runner_id: windows-arm64
            service_account: sa-ci-windows-arm64@sakm-ci-std-8560.iam.gserviceaccount.com
            darwin_flags: ""
            race: false
            check_coverage: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          check-latest: true

      - name: Run unit tests on native architecture
        shell: bash
        run: |
          if [ "${{ matrix.race }}" = "true" ]; then
            go test -v -race ./...
          else
            go test -v ./...
          fi

      - name: Verify 100% Test Coverage
        if: matrix.check_coverage == true
        shell: bash
        run: |
          go test -v -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out > coverage.txt
          cat coverage.txt
          TOTAL=$(grep 'total:' coverage.txt | awk '{print $3}')
          echo "Total coverage: $TOTAL"
          if [ "$TOTAL" != "100.0%" ]; then
            echo "ERROR: Code coverage is $TOTAL, which is less than required 100.0%"
            exit 1
          fi
          echo "Code coverage verification passed: 100.0%"

      - name: Build release binary on native architecture
        shell: bash
        run: |
          mkdir -p dist
          VER="${{ needs.version.outputs.version }}"
          COMMIT="${{ github.sha }}"
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          LDFLAGS="-s -w ${{ matrix.darwin_flags }} -X github.com/jay0lee/go-sa-key-manager/cmd.Version=${VER} -X github.com/jay0lee/go-sa-key-manager/cmd.GitCommit=${COMMIT:0:7} -X github.com/jay0lee/go-sa-key-manager/cmd.BuildDate=${BUILD_DATE}"

          echo "Building ${{ matrix.binary }} natively on ${{ matrix.runner }}..."
          CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o "dist/${{ matrix.binary }}" main.go

          echo "Verifying native binary execution..."
          "./dist/${{ matrix.binary }}" version

          ls -la dist/

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ matrix.service_account }}

      - name: Run Live GCP Integration Tests with Release Binary
        shell: bash
        env:
          GCP_PROJECT_STANDARD: ${{ env.GCP_PROJECT_STANDARD }}
          GCP_PROJECT_NO_CREATE: ${{ env.GCP_PROJECT_NO_CREATE }}
          GCP_PROJECT_NO_UPLOAD: ${{ env.GCP_PROJECT_NO_UPLOAD }}
          GCP_PROJECT_EXPIRY_24H: ${{ env.GCP_PROJECT_EXPIRY_24H }}
          GCP_RUNNER_ID: ${{ matrix.runner_id }}
          SAKM_BINARY_PATH: ${{ github.workspace }}/dist/${{ matrix.binary }}
        run: |
          go test -v -tags=live ./test/integration/...

      - name: Sign and Notarize macOS binary
        if: matrix.runner == 'macos-latest'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
        run: |
          BIN_PATH="dist/${{ matrix.binary }}"
          if [ -z "${MACOS_CERTIFICATE_P12:-}" ]; then
            echo "::warning::MACOS_CERTIFICATE_P12 secret is not configured in repository settings. Skipping macOS code signing and notarization."
            exit 0
          fi

          echo "Setting up temporary macOS keychain for code signing..."
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PWD="$(openssl rand -base64 32)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          # Decode certificate
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

          # Create and unlock temporary keychain
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Import certificate into temporary keychain
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "${MACOS_CERTIFICATE_PASSWORD:-}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Add keychain to user search list
          EXISTING_KEYCHAINS=$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

          # Detect Developer ID Application signing identity
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application:" | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
          if [ -z "$SIGNING_IDENTITY" ]; then
            # Fallback: check any valid code signing identity in the keychain
            SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep ')' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
          fi

          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "::error::Could not find a valid Developer ID code signing identity in imported certificate."
            exit 1
          fi

          echo "Signing $BIN_PATH with identity: $SIGNING_IDENTITY..."
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$BIN_PATH"

          echo "Verifying code signature..."
          codesign --verify --deep --strict --verbose=2 "$BIN_PATH"
          echo "✓ Code signature successfully verified."

          # Notarization via App Store Connect API Key (OAuth/JWT)
          if [ -n "${MACOS_NOTARY_KEY_ID:-}" ] && [ -n "${MACOS_NOTARY_ISSUER_ID:-}" ] && [ -n "${MACOS_NOTARY_KEY_P8:-}" ]; then
            echo "Submitting macOS binary to Apple Notary Service via App Store Connect API key..."
            NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${MACOS_NOTARY_KEY_ID}.p8"
            echo "$MACOS_NOTARY_KEY_P8" | base64 --decode > "$NOTARY_KEY_PATH" 2>/dev/null || echo "$MACOS_NOTARY_KEY_P8" > "$NOTARY_KEY_PATH"

            # Create zip for notary submission (Apple notarytool requires zip, pkg, or dmg)
            NOTARY_ZIP="$RUNNER_TEMP/notarize_${{ matrix.binary }}.zip"
            ditto -c -k --keepParent "$BIN_PATH" "$NOTARY_ZIP"

            # Submit and wait for notarization ticket
            xcrun notarytool submit "$NOTARY_ZIP" \
              --key "$NOTARY_KEY_PATH" \
              --key-id "$MACOS_NOTARY_KEY_ID" \
              --issuer "$MACOS_NOTARY_ISSUER_ID" \
              --wait

            echo "✓ Apple notarization completed successfully!"
            rm -f "$NOTARY_KEY_PATH" "$NOTARY_ZIP"
          else
            echo "::warning::App Store Connect API key secrets (MACOS_NOTARY_KEY_ID, MACOS_NOTARY_ISSUER_ID, MACOS_NOTARY_KEY_P8) not configured. Skipping Apple notarization."
          fi

      - name: Package binary archive (${{ matrix.archive }})
        shell: bash
        run: |
          if [ "${{ matrix.pkg_type }}" = "zip" ]; then
            if command -v zip >/dev/null 2>&1; then
              (cd dist && zip "${{ matrix.archive }}" "${{ matrix.binary }}")
            elif command -v powershell >/dev/null 2>&1; then
              powershell -Command "Compress-Archive -Path dist/${{ matrix.binary }} -DestinationPath dist/${{ matrix.archive }}"
            else
              tar -a -cf "dist/${{ matrix.archive }}" -C dist "${{ matrix.binary }}"
            fi
          else
            tar -cjf "dist/${{ matrix.archive }}" -C dist "${{ matrix.binary }}"
          fi
          ls -lh dist/

      - name: Upload verified binary and package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.runner_id }}
          path: dist/*
          if-no-files-found: error

      - name: Clean up macOS Keychain and signing assets
        if: always() && matrix.runner == 'macos-latest'
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/build.keychain" ]; then
            security delete-keychain "$RUNNER_TEMP/build.keychain" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/notarize_*.zip || true

  publish:
    name: Publish Release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all verified binaries and packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum gcp-sa-key-manager-*.tar.bz2 gcp-sa-key-manager-*.zip > checksums.txt
          cat checksums.txt

      - name: Attest Build Provenance for Binaries and Packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/gcp-sa-key-manager-*'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: Release ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.tar.bz2
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
