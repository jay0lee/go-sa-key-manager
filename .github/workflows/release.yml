name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v2026.09.17.1200). Defaults to UTC date/time tag.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Compute release version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${{ github.ref_name }}"
          else
            VER="v$(date -u +'%Y.%m.%d.%H%M')"
          fi
          echo "Release version: $VER"
          echo "version=$VER" >> $GITHUB_OUTPUT

  build:
    name: Build (${{ matrix.name }})
    needs: [version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native Linux x86_64
          - runner: ubuntu-latest
            name: Linux x86_64
            binary: gcp-sa-key-manager-linux-amd64
            darwin_flags: ""
          # Native Linux ARM64
          - runner: ubuntu-24.04-arm
            name: Linux ARM64
            binary: gcp-sa-key-manager-linux-arm64
            darwin_flags: ""
          # Native macOS Apple Silicon ARM64 (Intel x86_64 Mac explicitly excluded)
          - runner: macos-latest
            name: macOS Apple Silicon (ARM64)
            binary: gcp-sa-key-manager-darwin-arm64
            darwin_flags: "-macos 11.0"
          # Native Windows x86_64
          - runner: windows-latest
            name: Windows x86_64
            binary: gcp-sa-key-manager-windows-amd64.exe
            darwin_flags: ""
          # Native Windows ARM64
          - runner: windows-11-arm
            name: Windows ARM64
            binary: gcp-sa-key-manager-windows-arm64.exe
            darwin_flags: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build binary on native architecture
        shell: bash
        run: |
          mkdir -p dist
          VER="${{ needs.version.outputs.version }}"
          COMMIT="${{ github.sha }}"
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          LDFLAGS="-s -w ${{ matrix.darwin_flags }} -X github.com/jay0lee/go-sa-key-manager/cmd.Version=${VER} -X github.com/jay0lee/go-sa-key-manager/cmd.GitCommit=${COMMIT:0:7} -X github.com/jay0lee/go-sa-key-manager/cmd.BuildDate=${BUILD_DATE}"

          echo "Building ${{ matrix.binary }} natively on ${{ matrix.runner }}..."
          CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o "dist/${{ matrix.binary }}" main.go

          echo "Verifying native binary execution..."
          "./dist/${{ matrix.binary }}" version

          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.binary }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum gcp-sa-key-manager-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: Release ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
