name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native Linux x86_64
          - runner: ubuntu-latest
            name: Linux x86_64
            race: true
          # Native Linux ARM64
          - runner: ubuntu-24.04-arm
            name: Linux ARM64
            race: true
          # Native macOS Apple Silicon ARM64 (Intel x86_64 Mac explicitly excluded)
          - runner: macos-latest
            name: macOS Apple Silicon (ARM64)
            race: true
          # Native Windows x86_64
          - runner: windows-latest
            name: Windows x86_64
            race: true
          # Native Windows ARM64 (Note: Go race detector / TSAN is unsupported on windows/arm64)
          - runner: windows-11-arm
            name: Windows ARM64
            race: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          check-latest: true

      - name: Run unit tests on native architecture
        shell: bash
        run: |
          if [ "${{ matrix.race }}" = "true" ]; then
            go test -v -race ./...
          else
            go test -v ./...
          fi

      - name: Verify native build and execution
        shell: bash
        run: |
          go build -v -o ./test-bin main.go
          ./test-bin version

  coverage:
    name: Verify 100% Test Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          check-latest: true

      - name: Run coverage check
        run: |
          go test -v -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out > coverage.txt
          cat coverage.txt
          TOTAL=$(grep 'total:' coverage.txt | awk '{print $3}')
          echo "Total coverage: $TOTAL"
          if [ "$TOTAL" != "100.0%" ]; then
            echo "ERROR: Code coverage is $TOTAL, which is less than required 100.0%"
            exit 1
          fi
          echo "Code coverage verification passed: 100.0%"
